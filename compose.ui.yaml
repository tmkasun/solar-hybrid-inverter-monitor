# Frontend-only LAN deployment behind Traefik.
# Traefik terminates local HTTPS and forwards HTTP to this container over
# the external proxy network.
services:
  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_UPSTREAM: ${PI_API_UPSTREAM:?Set PI_API_UPSTREAM in .env.ui, for example 192.168.1.50:8000}
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.solar-ui.rule=Host(`${SOLAR_UI_HOST:-solar.knnect.lk}`)
      - traefik.http.routers.solar-ui.entrypoints=websecure
      - traefik.http.routers.solar-ui.tls=true
      - traefik.http.routers.solar-ui.service=solar-ui
      - traefik.http.routers.solar-ui-http.rule=Host(`${SOLAR_UI_HOST:-solar.knnect.lk}`)
      - traefik.http.routers.solar-ui-http.entrypoints=web
      - traefik.http.routers.solar-ui-http.middlewares=solar-ui-https-redirect
      - traefik.http.routers.solar-ui-http.service=noop@internal
      - traefik.http.middlewares.solar-ui-https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.solar-ui-https-redirect.redirectscheme.permanent=true
      - traefik.http.services.solar-ui.loadbalancer.server.port=80
    expose:
      - "80"
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true

networks:
  proxy:
    external: true
