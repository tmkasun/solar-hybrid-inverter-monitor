# Frontend-only deployment for home.knnect.lk.
# Put this behind the host's HTTPS nginx proxy. Set PI_API_UPSTREAM to the Pi's
# private LAN/VPN address, or another host:port reachable from this container.
services:
  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_UPSTREAM: ${PI_API_UPSTREAM:?Set PI_API_UPSTREAM in .env.ui, for example 192.168.1.50:8000}
    ports:
      - "127.0.0.1:8080:80"
    security_opt:
      - no-new-privileges:true
